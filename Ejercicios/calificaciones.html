<!DOCTYPE html>
<html lang="es">
  
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3: Analizador de calificaciones</title>

    
    <style>
        
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 24px;
        }
        
        .tarjeta {
            max-width: 460px;
            margin: 0 auto;
            padding: 24px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        
        h1 {
            margin-top: 0;
            font-size: 1.4rem;
        }
        
        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #2563eb;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #1d4ed8;
        }
        
        #resultado {
            margin-top: 18px;
        }
        
        .ok,
        .error,
        .aviso {
            padding: 12px;
            border-radius: 6px;
        }
        
        .ok {
            color: #166534;
            background-color: #dcfce7;
            border: 1px solid #4ade80;
        }
        
        .error {
            color: #991b1b;
            background-color: #fee2e2;
            border: 1px solid #f87171;
        }
        
        .aviso {
            color: #92400e;
            background-color: #fffbeb;
            border-left: 5px solid #fbbf24;
            font-size: 0.9rem;
        }
        
        .nota {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #64748b;
        }
        
    </style>
</head>

<body>

    <!-- ESTRUCTURA HTML -->
    <div class="tarjeta">
        <h1>Analizador de calificaciones</h1>

        <p class="aviso">Haz clic en el botón para analizar el conjunto de notas cargado en el arreglo.</p>

        <button id="btn-analizar">Analizar</button>

        <div id="resultado" hidden>
            <!-- Se llena dinámicamente mediante JavaScript -->
        </div>

        <p class="nota">Considera aprobadas las calificaciones mayores o iguales a 7.00 sobre 10.</p>
    </div>

    <!-- LÓGICA JavaScript -->
    <script>
        // Arreglo inicial de calificaciones
        const calificaciones = [8, 6, 9, 7, 5, 10, 4, 7];

        // Pruebas adicionales sugeridas por el ejercicio (descomenta para probar):
        // const calificaciones = [7, 8, 9, 10, 7, 8, 9, 10]; 
        // const calificaciones = [4, 5, 6, 3, 2, 6, 5, 4];  
        // const calificaciones = [8, 6, 12, 7, -2, 10];

        function analizarCalificaciones() {
            const contenedorResultado = document.getElementById("resultado");

            // RETO OPCIONAL:
            let hayError = false;
            let notasInvalidas = [];

            for (let i = 0; i < calificaciones.length; i++) {
                if (calificaciones[i] < 0 || calificaciones[i] > 10) {
                    hayError = true;
                    notasInvalidas.push(calificaciones[i]);
                }
            }

            if (hayError) {
                contenedorResultado.className = "error";
                contenedorResultado.innerHTML =
                    "<strong>✘ Error:</strong> Se detectaron calificaciones fuera del rango válido (0 a 10): " +
                    notasInvalidas.join(", ") + ". Corrige los datos antes de continuar.";
                contenedorResultado.hidden = false;
                return; // 
            }

            // ANÁLISIS DE DATOS SIN reduce(), Math.max() ni Math.min()
            let suma = 0;
            let notaMaxima = calificaciones[0];
            let notaMinima = calificaciones[0];
            let aprobadas = 0;
            let noAprobadas = 0;

            for (let i = 0; i < calificaciones.length; i++) {
                const notaActual = calificaciones[i];

                
                suma += notaActual;

               
                if (notaActual > notaMaxima) {
                    notaMaxima = notaActual;
                }

                
                if (notaActual < notaMinima) {
                    notaMinima = notaActual;
                }

               
                if (notaActual >= 7) {
                    aprobadas++;
                } else {
                    noAprobadas++;
                }
            }

            // Cálculo del promedio
            const promedio = suma / calificaciones.length;

            // MOSTRAR RESULTADOS
            contenedorResultado.className = "ok";
            contenedorResultado.innerHTML = `
        <ul class="lista-resultados">
          <li><strong>Calificaciones:</strong> ${calificaciones.join(", ")}</li>
          <li><strong>Promedio:</strong> ${promedio.toFixed(2)}</li>
          <li><strong>Nota más alta:</strong> ${notaMaxima}</li>
          <li><strong>Nota más baja:</strong> ${notaMinima}</li>
          <li><strong>Aprobadas:</strong> ${aprobadas}</li>
          <li><strong>No aprobadas:</strong> ${noAprobadas}</li>
        </ul>
      `;

            contenedorResultado.hidden = false;
        }

        // Evento al presionar el botón Analizar
        document.getElementById("btn-analizar").addEventListener("click", analizarCalificaciones);
    </script>
</body>

</html>
